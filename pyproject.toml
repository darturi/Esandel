[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esandel"
version = "0.1.0"
description = "A LangGraph workflow for drafting, judging, and revising answers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "langgraph>=1,<2",
    "pydantic>=2,<3",
]

[project.scripts]
esandel = "esandel.cli:main"
